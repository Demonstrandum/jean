[package]
name = "harness"
edition.workspace = true
version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
sha2 = "0.10"
store = { version = "0.1.0", path = "../store" }

[dev-dependencies]
tiny_http = "0.12.0"
