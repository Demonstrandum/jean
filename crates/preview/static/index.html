<!doctype html>
<meta charset="utf-8">
<title>ui preview</title>
<style>
  html, body { margin: 0; }
  body { background: #c8c8c8; display: flex; justify-content: center; padding: 20px 0 56px; font: 13px system-ui, sans-serif; }
  #stage { position: relative; }
  #scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #screen { box-shadow: 0 0 0 10px #222; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center;
        background: #b4b4b4; z-index: 20; }
  nav a { color: #111; text-decoration: none; padding: 2px 8px; }
  nav a.on { background: #111; color: #fff; }
  #fit { white-space: nowrap; margin-left: 18px; padding: 2px 8px; font-weight: 700; }
  #fit.bad { background: #c00; color: #fff; }
</style>
<div id="stage"><div id="scaler"><main id="screen"></main></div></div>
<nav id="scenenav"></nav>
<script src="/ui.js"></script>
<script src="/seeds.js"></script>   <!-- the real screens, run directly here (the live display gets them through its journal) -->
<script>
  const sp = new URLSearchParams(location.search);

  // ---- fit the pretend screen into the window ------------------------------
  const stage = document.getElementById("stage"), scaler = document.getElementById("scaler");
  function fit() {
    const W = ui.screen.offsetWidth, H = ui.screen.offsetHeight;
    const availW = innerWidth - 60, availH = innerHeight - 100;
    const tall = H > 1000; // long component sheets: fit width only, scroll
    const s = tall ? Math.min(availW / W, 1) : Math.min(availW / W, availH / H);
    scaler.style.transform = `scale(${s})`;
    stage.style.width = W * s + "px";
    stage.style.height = H * s + "px";
  }
  new ResizeObserver(fit).observe(ui.screen);
  addEventListener("resize", fit);

  // ---- the design language --------------------------------------------------------
  // Landscape-style modules on a 6x3 sheet: hard corners, 1px lines, small centred icons, the day clock,
  // grainy wavy gradients. State is carried by tiny sigils (corner clusters and inline), not by words:
  //   top-left = the machine (state, link, data age, peers), top-right = the world (wind, cloud cover, pressure, mode).
  // top-left = the machine (link, wifi, cpu, disk), top-right = the world (wind, cloud cover, moon, events left); re-read at every redraw.
  // corner sigils for the sample layouts (the real screens' live ones are ui.shell()'s)
  const SIG = {
    tl: [sig.state(State.Ok), sig.bars(4), sig.level(3, 8), sig.count(5)],
    tr: [sig.dir(220), sig.level(7, 8), sig.trend(Trend.Fall), sig.glyph("moon")],
  };
  const sheet = (...modules) => ui.show(fill(tilegrid(...modules)));
  const price = [1.1, 0.9, 0.5, 0.42, 0.41, 0.55, 0.9, 1.4, 1.8, 1.6, 1.3, 1.2, 1.1, 1.0, 1.1, 1.3, 1.7, 2.05, 1.9, 1.6, 1.4, 1.2, 1.1, 1.0];
  const wave = (n, base, amp, seed) => Array.from({ length: n }, (_, i) => Math.max(0.03, Math.min(1, base + amp * Math.sin(i / 2.1 + seed) + 0.22 * Math.abs(Math.sin(i * 1.7 + seed)) * (i % 6 === 0 ? 1.6 : 0.4))));
  const disk = Array.from({ length: 30 }, (_, i) => +(1.18 + i * 0.0085 + (i > 20 ? (i - 20) * 0.004 : 0)).toFixed(3));

  // ---- real data: every module below is bound to a feed (feeds/*.py), so it shows the machine, the weather, the tariff, the lists.
  // A binding draws "–" until its first value, then redraws only on its tier's next beat after the value changes.
  const MIN = { tier: 60000 };                       // minute-aligned: clocks, "next in", past/future
  const num = (v, d = 0) => (v == null || isNaN(v) ? "–" : Number(v).toFixed(d));
  const dur = (m) => (m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`);
  const upfmt = (s) => (s == null ? "–" : s >= 86400 ? `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`);
  const last = (a, n) => { const t = (a ?? []).slice(-n); return Array(Math.max(0, n - t.length)).fill(0).concat(t); };
  const nowHM = () => new Date().toTimeString().slice(0, 5);
  const sqrtScale = (a, top) => a.map((x) => Math.sqrt(Math.min(1, x / top)));
  const pctCell = (v) => div({ style: "display:flex;align-items:center;gap:7px;min-width:92px" }, div({ style: "flex:1" }, segbar(Math.min(100, v), 100)), v.toFixed(1));

  const scenes = {
    // The link to the machine itself.
    live() {
      const fmtT = (t) => new Date(t).toTimeString().slice(0, 8);
      sheet(
        place(tile("sys · load", feed(K.sys.load, (v) => bignum(fmt.num(v, 2))), { glyph: "cpu", count: ["up ", feed(K.sys.uptime, (s) => fmt.uptime(s))] }), "1 / 1 / 2 / 3"),
        place(tile("sys · memory", feed(K.mem.pct, (v) => readouts([{ label: "RAM", value: v ?? 0, text: String(v), unit: "%" }])), { glyph: "memory", count: "feeds/machine.py" }), "1 / 3 / 2 / 5"),
        place(tile("Wi-Fi", feed([K.wifi.bars, K.wifi.rssi], ([bars, rssi]) => div({ style: "display:flex;gap:10px;align-items:center;font:600 17px var(--sans)" }, sigil(sig.bars(bars ?? 0), 24), rssi != null ? ui.h("small", rssi + " dBm") : "")), { glyph: "wifi", count: "feeds/wifi.sh · 15 s" }), "1 / 5 / 2 / 7"),
        place(tile("beat clock", feed(K.link.server, (l) => { const b = ui.beats(); return lines([["tick", "1 s", "timers"], ["beat", b.cadence.beat / 1000 + " s", "live data"], ["slow", b.cadence.slow / 60000 + " min", "weather"], ["last", b.lastFlush ? fmtT(b.lastFlush) : "–", b.flushes + " batches"], ["link", Link[l] ?? "–", b.bindings + " bound"]]); }, { always: true }), { glyph: "clock", tone: "list", count: "one batch per beat = one repaint" }), "2 / 1 / 4 / 4"),
        place(tile("feeds", feed(K.link.server, () => div("see GET /feeds"), { always: true }), { glyph: "wave", tone: "list", count: "machine · net · wifi · weather · power · lists" }), "2 / 4 / 4 / 7"),
      );
    },

    // ---- sample scenes: designed layouts on made-up numbers (no sensors or accounts behind them)
    // One room, stated exactly.
    room() {
      const t24 = [21.4, 21.1, 20.9, 20.8, 20.8, 21.0, 21.6, 22.4, 23.1, 23.8, 24.4, 24.9, 25.4, 25.9, 25.7, 25.5, 25.3, 25.0, 24.6, 24.1, 23.6, 23.0, 22.4, 21.8];
      sheet(
        place(tile("Living room", div({ style: "width:100%" },
          hero("25.5", { unit: "°C", size: 78, status: "COOLING → 23.0", sub: "out 27°" }), div({ style: "height:6px" }),
          readouts([
            { label: "Temp", value: 25.5, max: 30, text: [sigil("trend", "down", 10), " 25.5"], unit: "°C" },
            { label: "Humid", value: 48, text: "48", unit: "%" },
            { label: "CO₂", value: 620, max: 1500, text: "620", unit: "ppm" },
            { label: "PM2.5", value: 6, max: 50, text: "6", unit: "µg" },
          ])), { glyph: "thermo", count: "zigbee ×2" }), "1 / 1 / 3 / 4"),
        place(tile("Scale · target 23.0", ruler({ min: 16, max: 30, value: 25.5, target: 23, step: 2, w: 330 }), { glyph: "thermo", count: [sigil("trend", "fall"), " Δ +2.5 · −0.8/h"], tone: "fill" }), "1 / 4 / 2 / 7"),
        place(tile("Scenes · ceiling ×3", div({ style: "width:100%;display:flex;flex-direction:column;gap:7px" },
          pills([{ label: "Dinner", icon: "utensils" }, "Movie", "Off"], { active: 0 }), slider(0.6, "BRIGHT")), { glyph: "bulb", count: "12:58 by voice" }), "2 / 4 / 3 / 7"),
        place(tile("Devices", [device({ name: "TV · 90 W", on: true, icon: "tv" }), device({ name: "Floor lamp", on: false, icon: "bulb" })], { glyph: "plug", count: [sigil("count", 2), " of 9 on"], tone: "list" }), "3 / 1 / 4 / 4"),
        place(tile("24 h temp", areaChart(t24, { w: 330, h: 64, now: 13.3, labels: [["00", 0], ["06", 6], ["12", 12], ["18", 18]] }), { glyph: "thermo", count: "min 20.8 @03 · max 25.9 @13", tone: "fill" }), "3 / 4 / 4 / 7"),
      );
    },
    // A console: square modules and Claude's activity log.
    console() {
      const rooms = [25.5, 22.1, 21.4, 23.0, 20.2, 24.4];
      const rows = Array.from({ length: 6 }, (_, d) => Array.from({ length: 24 }, (_, hr) => 0.25 + 0.55 * Math.exp(-Math.pow((hr - (8 + d % 3)) / 2.6, 2)) + 0.8 * Math.exp(-Math.pow((hr - 19) / 2.4, 2)) + 0.05 * Math.sin(hr + d)));
      const use24 = Array.from({ length: 24 }, (_, hr) => 0.3 + 0.5 * Math.exp(-Math.pow((hr - 8) / 2.5, 2)) + 0.9 * Math.exp(-Math.pow((hr - 19) / 2.2, 2)));
      sheet(
        place(tile("wx", word("WX", "12° RAIN"), { tone: "fill" }), "1 / 1 / 2 / 2"),
        place(tile("24 h", polar(use24, { labels: [["00", 0], ["06", 6], ["12", 12], ["18", 18]] }), { tone: "fill" }), "1 / 2 / 2 / 3"),
        place(tile("6 d", ridgeline(rows, { w: 100, h: 92, hours: [["0", 0], ["12", 12], ["23", 23]] }), { tone: "fill" }), "2 / 1 / 3 / 2"),
        place(tile("sun", dayDial({ rise: "07:42", set: "16:48", size: 88 }), { tone: "fill" }), "2 / 2 / 3 / 3"),
        place(tile("equ", div({ style: "font:500 9.5px/1.6 var(--mono)" }, ["EQU .0093/226+784", "98RTA> 34(PB)", "kWh 7.4/10=.74", "ΔT +2.5 −0.8/h", "P 1008 ↓ 3hPa"].map((l) => div(l))), { tone: "fill" }), "3 / 1 / 4 / 2"),
        place(tile("enr", word("ENR", "1.12 KR"), { tone: "fill" }), "3 / 2 / 4 / 3"),
        place(tile("claude", div({ style: "display:flex;flex-direction:column;width:100%;height:100%;gap:6px" },
          pane(bignum("IDLE")),
          div({ style: "flex:1.3;min-height:0" }, lines([["07:43", "heard: egg time?", "1.8s"], ["07:43", "timer set 06:30"], ["07:42", "greeted · jacket"], ["07:40", "wx fetch ok", "ok"]])),
          div({ style: "height:34px" }, dotBars(wave(30, 0.3, 0.2, 7), { rows: 3 }))), { tone: "list", count: "idle · 14 turns" }), "1 / 3 / 4 / 5"),
        place(tile("cpu", dotBars(wave(18, 0.3, 0.16, 0), { rows: 8 }), { tone: "fill" }), "1 / 5 / 2 / 6"),
        place(tile("sys", word("SYS", "OK 4/5"), { tone: "fill" }), "1 / 6 / 2 / 7"),
        place(tile("rooms", polar(rooms, { max: 30, rings: 3, marks: true, labels: [["L", 0], ["K", 1], ["B", 2], ["O", 3], ["H", 4], ["G", 5]] }), { tone: "fill" }), "2 / 5 / 3 / 6"),
        place(usageTile("disk", disk, 4, "1.43/4 TB"), "2 / 6 / 3 / 7"),
        place(tile("net", dotMirror(wave(20, 0.1, 0.07, 5), wave(20, 0.45, 0.3, 2), { rows: 4 }), { tone: "fill" }), "3 / 5 / 4 / 6"),
        place(tile("tmr", word("TMR", "06:30"), { tone: "fill" }), "3 / 6 / 4 / 7"),
      );
    },
    // Motion, stepped for e-ink: one-second ticks, words, shifting graphs.
    motion() {
      const rnd = (a, b) => a + Math.random() * (b - a);
      sheet(
        place(tile("Timer · egg", liveTimer(390, { label: "egg" }), { glyph: "clock", tone: "fill", count: [spinner(11), " ticks 1/s"] }), "1 / 1 / 4 / 3"),
        place(tile("Claude · thinking", div({ style: "display:flex;gap:10px;width:100%;align-items:flex-start" }, spinner(18), typewriter("Checking the forecast. Rain from 15:00, so take a jacket.", { step: 2 })), { glyph: "sparkle", count: "2 words / s" }), "1 / 3 / 2 / 7"),
        place(tile("Today · kWh", countUp(7.4, { from: 0, ticks: 6, dec: 1, unit: "kWh" }), { glyph: "bolt", count: [sigil("trend", "up"), " counts up, eased"] }), "2 / 3 / 4 / 5"),
        place(tile("net · eth0 · live", stream([wave(30, 0.1, 0.07, 5), wave(30, 0.45, 0.3, 2)], () => [rnd(0.03, 0.2), rnd(0.2, 0.8)], (s) => dotMirror(s[0], s[1], { rows: 4 }), 2000), { tone: "legend", count: "shifts 1 col / 2 s" }), "2 / 5 / 3 / 7"),
        place(tile("cpu · live", stream([wave(30, 0.3, 0.14, 0)], () => [rnd(0.15, 0.7)], (s) => dotBars(s[0], { rows: 5 }), 1000), { tone: "legend", count: "1 col / s" }), "3 / 5 / 4 / 7"),
      );
    },
    // After a voice question.
    answer() {
      sheet(
        place(tile("You asked", div({ class: "ask" }, "How long do I boil an egg?"), { glyph: "sparkle", count: "07:43 · en · conf 0.93 · 1.8 s", tone: "fill" }), "1 / 1 / 2 / 7"),
        place(tile("Answer", bignum("6½", { unit: "min" }), { inverted: true, glyph: "clock", count: "jammy yolk · from boiling" }), "2 / 1 / 4 / 3"),
        place(tile("Timer", timerRing(390, 390), { glyph: "clock", count: "set 07:43 · rings 07:50", tone: "fill" }), "2 / 3 / 4 / 5"),
        place(tile("Steps", list(["Bring water to a boil", "Lower the eggs in", "Start the timer", "Ice bath, 2 min", "Peel under water"], { ordered: true }), { glyph: "check", count: [sigil("count", 5), " steps"], tone: "list" }), "2 / 5 / 4 / 7"),
      );
    },
    // Your coding agents.
    agents() {
      sheet(
        place(tile("Needs you", div({ class: "ask" }, "Which e-ink panel should I target?"), { glyph: "warn", count: [sigil("state", "warn"), " harness · 1 min · blocks display-ui"], inverted: true, tone: "fill" }), "1 / 1 / 2 / 7"),
        place(tile("Sessions", table([["display-ui", sigil("state", "ok", 10), "writing ui.ts", "12m"], ["harness", sigil("state", "warn", 10), "needs answer", "1m"], ["browser-orch", sigil("state", "idle", 10), "PR #41", "26m"], ["voice-loop", sigil("state", "ok", 10), "tests", "4m"]], { head: ["session", "", "state", "age"] }),
          { glyph: "nodes", count: "5 sessions · 3 running · 1 blocked" }), "2 / 1 / 4 / 4"),
        place(tile("Pipeline", readouts([{ label: "PRs", value: 4, max: 10, text: "4", unit: "open" }, { label: "CI", value: 98, text: "98", unit: "%" }, { label: "Tok", value: 1.2, max: 5, text: "1.2", unit: "M" }]), { glyph: "check", count: "last 2 h" }), "2 / 4 / 3 / 7"),
        place(tile("Peers", kvgrid({ Active: "3", Idle: "2", Blocked: "1", Queue: "0", Tokens: "1.2M", Cost: "$4.10" }, 2), { glyph: "hub", count: "agent graph · 6 nodes" }), "3 / 4 / 4 / 7"),
      );
    },
    // Every icon (fitted to one live area), the sigils, and the weather symbols.
    icons() {
      ui.size(800, 820);
      ui.show(
        topbar("Icons", `${ui.icons().length} + weather`),
        div({ style: "display:grid;grid-template-columns:repeat(9,1fr);gap:12px 6px" },
          ...ui.icons().map((n) => col({ class: "center" }, icon(n, { size: 30 }), small(n)))),
        divider(),
        row({ class: "fit" }, ["clear", "night", "partly", "cloudy", "rain", "snow", "storm", "fog", "wind"].map((k) => col({ class: "center" }, weatherIcon(k, 56), small(k)))),
        divider(),
        row({ class: "fit" }, [
          ["state", "ok"], ["state", "idle"], ["state", "warn"], ["state", "err"], ["state", "?"], ["level", [0, 8]], ["level", [2, 8]], ["level", [4, 8]], ["level", [6, 8]], ["level", [8, 8]],
          ["trend", "up"], ["trend", "down"], ["trend", "flat"], ["trend", "rise"], ["trend", "fall"], ["age", 0], ["age", 15], ["age", 30], ["age", 45], ["age", 90],
          ["count", 1], ["count", 3], ["count", 5], ["count", 6], ["count", 9], ["dir", 0], ["dir", 90], ["dir", 220], ["bars", 1], ["bars", 4],
        ].map(([k, v]) => col({ class: "center" }, sigil(k, v, 26), small(`${k} ${Array.isArray(v) ? v.join("/") : v}`)))));
    },
  };

  // The real screens (crates/ui/ts/screens.ts) are the tabs along the bottom of the display; the rest of this page is the gallery of
  // sample layouts. ?screen=energy shows a real one (default home), ?scene=console a gallery one.
  const sample = scenes[sp.get("scene")] ? sp.get("scene") : null;
  const name = sample ?? (ui.screenIds().includes(sp.get("screen")) ? sp.get("screen") : ui.screenIds()[0]);
  const ek = sp.get("eink");
  // layout depends on the fonts, so nothing is built (or measured) until they are loaded
  ui.ready().then(() => {
    if (sp.get("accent")) ui.accent("#" + sp.get("accent"));
    if (ek !== null) ui.eink({ algo: ek || "atkinson" });
    if (sample) {
      scenes[sample]();
      if (sample !== "icons") ui.frame({ title: sample + " · sample", sheet: `${Object.keys(scenes).indexOf(sample) + 1}/${Object.keys(scenes).length}`, ...SIG });
    } else {
      ui.set(K.ui.hold, 0);        // a preview stays on the screen you asked for
      ui.shell();
      ui.go(name, { hold: 0 });
    }
    fit();
    showFit();
  });

  // ---- navigation (outside the screen): the real screens, then the gallery
  const navEl = document.getElementById("scenenav");
  const gotoScreen = (n) => fetch(`/screen?name=${encodeURIComponent(n)}&hold=0`, { method: "POST" });   // the server's key: what voice would write
  const markNav = () => navEl.querySelectorAll("a[data-screen]").forEach((a) => a.classList.toggle("on", !sample && a.dataset.screen === ui.current()));
  const link = (label, key, val, on) => {
    const q = new URLSearchParams(); q.set(key, val);
    const a = document.createElement("a"); a.href = "?" + q; a.textContent = label; if (on) a.className = "on";
    if (key === "screen") {
      a.dataset.screen = val;
      // on a real screen the links switch it in place, exactly as the harness would; from a gallery page they open it
      a.addEventListener("click", (e) => { if (!sample) { e.preventDefault(); gotoScreen(val); } });
    }
    navEl.append(a);
  };
  for (const n of ui.screenIds()) link(n, "screen", n, !sample && n === name);
  const sep = document.createElement("span"); sep.textContent = "|"; sep.style.opacity = ".4"; navEl.append(sep);
  for (const n of Object.keys(scenes)) link(n, "scene", n, n === sample);
  addEventListener("ui:screen", markNav);
  // 1-7 switch screens too (preview only: the panel itself takes no input)
  addEventListener("keydown", (e) => { const n = ui.screenIds()[Number(e.key) - 1]; if (n && !sample && !e.metaKey && !e.ctrlKey) gotoScreen(n); });
  if (!sample && sp.get("screen")) gotoScreen(sp.get("screen"));   // ?screen=energy wins over whatever the server last showed

  // ---- fit indicator: the screen always contains the scene; this says how --------------
  const fitEl = document.createElement("span");
  fitEl.id = "fit";
  navEl.append(fitEl);
  function showFit() {
    const f = ui.fits();
    const bad = f.clipped || f.dropped.length || f.crowded.length;
    fitEl.className = bad ? "bad" : "";
    fitEl.textContent = f.crowded.length ? `crowded: ${f.crowded.map((c) => c.split(" ")[0]).join(", ")}`
      : f.clipped ? `clipped at ×${f.scale}`
      : f.dropped.length ? `hid ${f.dropped.length} · ×${f.scale}`
      : f.scale < 1 ? `scaled ×${f.scale}`
      : `natural fit · ${f.freeY}px free`;
  }
  addEventListener("ui:settled", showFit);
  showFit();
</script>
